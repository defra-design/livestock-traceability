{% extends "layouts/main.html" %}

{% set pageName="Upload cattle information" %}

{% block content %}

<div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
            Upload cattle information
        </h1>

        <p class="govuk-body">
            Files must be in CSV or XLS format. Maximum file size is 2 megabytes.
        </p>

        <div class="govuk-form-group">
            <label class="govuk-label" for="file-upload-1">
                Upload a file
            </label>
            <div class="govuk-drop-zone"
                 data-module="govuk-file-upload">
                <input class="govuk-file-upload" id="file-upload-1" name="fileUpload1" type="file">
            </div>
        </div>

        <a href="upload-summary" role="button" draggable="false" class="govuk-button" data-module="govuk-button">
            Continue
        </a>

    </div>
</div>

{% endblock %}
